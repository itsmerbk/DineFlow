name: DineFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Compile Java 21 sources
        run: |
          mkdir -p out
          javac -cp "lib/*" -d out src/com/dineflow/*.java
      - name: Run DineFlow POS & KDS Assertions
        run: java -ea --enable-native-access=ALL-UNNAMED -cp "out:lib/*" com.dineflow.DineFlowTest
